{% extends "base.html" %}

{% block title %}Підтвердження видалення{% endblock %}

{% block content %}
<div class="container py-5" style="max-width: 560px;">
    <div class="card card-custom border-danger shadow-sm bg-white p-4 p-md-5 text-center">
        <div class="text-danger fs-1 mb-2">
            <i class="bi bi-exclamation-triangle-fill"></i>
        </div>
        <h3 class="fw-bold mb-3">Підтвердження видалення</h3>
        <p class="text-secondary mb-4">
            Ви дійсно хочете видалити пост <strong class="text-dark">"{{ post.title }}"</strong>? Цю дію неможливо скасувати.
        </p>

        <form method="POST" class="d-flex justify-content-center gap-3">
            <button type="submit" class="btn btn-danger rounded-pill px-4">
                Так, видалити
            </button>
            <a href="{{ url_for('posts.detail_post', id=post.id) }}" class="btn btn-outline-secondary rounded-pill px-4">
                Скасувати
            </a>
        </form>
    </div>
</div>
{% endblock %}
