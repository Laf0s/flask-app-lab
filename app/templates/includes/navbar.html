<header class="sticky-top shadow-sm">
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand fw-bold d-flex align-items-center gap-2" href="{{ url_for('resume') }}">
        <i class="bi bi-terminal-fill text-primary"></i>
        <span>Андрій Яцишин</span>
      </a>

      <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar" aria-controls="mainNavbar" aria-expanded="false" aria-label="Навігація">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="mainNavbar">
        <ul class="navbar-nav me-auto align-items-lg-center">
          <li class="nav-item">
            <a class="nav-link {% if request.endpoint == 'home' %}active fw-semibold{% endif %}" href="{{ url_for('home') }}">Головна</a>
          </li>
          <li class="nav-item">
            <a class="nav-link {% if request.endpoint == 'resume' %}active fw-semibold{% endif %}" href="{{ url_for('resume') }}">Резюме</a>
          </li>
          <li class="nav-item">
            <a class="nav-link {% if request.endpoint == 'products.list_products' %}active fw-semibold{% endif %}" href="{{ url_for('products.list_products') }}">Продукти</a>
          </li>
          <li class="nav-item">
            <a class="nav-link {% if request.endpoint == 'contacts' %}active fw-semibold{% endif %}" href="{{ url_for('contacts') }}">Контакти</a>
          </li>
        </ul>

        <ul class="navbar-nav ms-auto align-items-lg-center gap-2 mt-2 mt-lg-0">
          {% if session.get('username') %}
            <li class="nav-item">
              <a class="nav-link {% if request.endpoint == 'users.profile' %}active fw-semibold text-info{% endif %}" href="{{ url_for('users.profile') }}">
                <i class="bi bi-person-circle me-1"></i> Профіль ({{ session.get('username') }})
              </a>
            </li>
            <li class="nav-item">
              <a class="btn btn-outline-danger btn-sm rounded-pill px-3" href="{{ url_for('users.logout') }}">
                Вийти
              </a>
            </li>
          {% else %}
            <li class="nav-item">
              <a class="btn btn-outline-light btn-sm rounded-pill px-3 {% if request.endpoint == 'users.login' %}active{% endif %}" href="{{ url_for('users.login') }}">
                <i class="bi bi-box-arrow-in-right me-1"></i> Вхід
              </a>
            </li>
          {% endif %}
        </ul>
      </div>
    </div>
  </nav>
</header>
