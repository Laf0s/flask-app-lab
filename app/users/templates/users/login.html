{% extends 'base.html' %}

{% block title %}Login | Flask Auth{% endblock %}

{% block content %}
<div class="row justify-content-center mt-4">
  <div class="col-12 col-sm-8 col-md-6 col-lg-5">
    <div class="card border-0 shadow-sm p-4 bg-white rounded-3">
      <h2 class="text-center text-secondary fw-normal mb-4">Login</h2>

      <form method="POST" action="{{ url_for('users.login') }}">
        <div class="mb-3">
          <label for="username" class="form-label text-muted small mb-1">User name</label>
          <input type="text" class="form-control" id="username" name="username" required autofocus>
        </div>

        <div class="mb-4">
          <label for="password" class="form-label text-muted small mb-1">Password</label>
          <input type="password" class="form-control" id="password" name="password" required>
        </div>

        <button type="submit" class="btn btn-info text-white w-100 py-2 fw-semibold" style="background-color: #0088b7; border-color: #0088b7;">
          Sign in
        </button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
