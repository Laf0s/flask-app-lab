{% extends 'base.html' %}

{% block title %}Профіль | {{ username }}{% endblock %}

{% block content %}
<div class="mt-3">
  <div class="p-3 text-white rounded-1 d-flex align-items-center" style="background-color: #0d6efd; font-size: 1.5rem;">
    <span class="fw-normal">Ласкаво просимо до сторінки</span>
    <span class="ms-3 badge bg-dark bg-opacity-25 px-3 py-1 d-inline-flex align-items-center gap-2">
      <i class="bi bi-people-fill"></i>
      <span>{{ username }}!</span>
    </span>
  </div>

  <div class="mt-3">
    <p class="text-secondary small mb-2">Тут ви можете отримати інформацію та вийти з системи.</p>
    <a href="{{ url_for('users.logout') }}" class="btn btn-danger btn-sm px-3">
      Вийти
    </a>
  </div>
</div>
{% endblock %}
