{% extends "base.html" %}

{% block title %}Account | {{ user.username }}{% endblock %}

{% block content %}
<div class="container py-4" style="max-width: 720px;">
  <div class="card border-0 shadow-sm p-4 p-md-5 bg-white rounded-3 mb-3">
    <h1 class="display-6 fw-bold mb-2">Welcome, {{ user.username }}!</h1>
    <p class="fs-5 text-secondary mb-3">You have successfully logged in to your profile.</p>
    <p class="fs-5 mb-0"><strong>Email:</strong> {{ user.email }}</p>
  </div>

  <div class="d-flex gap-2">
    <a href="{{ url_for('users.logout') }}" class="btn btn-danger px-4">Logout</a>
    <a href="{{ url_for('users.profile') }}" class="btn btn-outline-secondary px-4">Cookies & Тема</a>
  </div>
</div>
{% endblock %}
