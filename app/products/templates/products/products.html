{% extends 'base.html' %}

{% block title %}Список товарів | Андрій Яцишин{% endblock %}

{% block content %}
<div class="container py-5">
    <h2 class="mb-4 fw-bold text-primary">Каталог товарів</h2>
    <div class="row g-4">
        {% for product in products %}
        <div class="col-md-4">
            <div class="card h-100 shadow-sm border-0">
                <div class="card-body d-flex flex-column">
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <h5 class="card-title fw-bold mb-0">{{ product.name }}</h5>
                        <span class="badge bg-primary fs-6">${{ product.price }}</span>
                    </div>
                    <p class="card-text text-muted flex-grow-1">
                        {{ product.content }}
                    </p>
                    <a href="{{ url_for('products.detail_product', product_id=product.id) }}" class="btn btn-outline-primary mt-3">
                        Детальніше
                    </a>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
