{% extends 'base.html' %}

{% block title %}{{ product.name }} | Деталі товару{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="card shadow-sm border-0 p-4 mx-auto" style="max-width: 650px;">
        <div class="card-body">
            <span class="text-muted small">ID товару: #{{ product.id }}</span>
            <h2 class="card-title fw-bold text-primary mt-1 mb-3">{{ product.name }}</h2>
            <h4 class="text-success fw-semibold mb-4">Ціна: ${{ product.price }}</h4>

            <h6 class="fw-bold text-secondary">Опис:</h6>
            <p class="card-text fs-5 mb-4">{{ product.content }}</p>

            <a href="{{ url_for('products.list_products') }}" class="btn btn-secondary">
                &larr; Назад до списку товарів
            </a>
        </div>
    </div>
</div>
{% endblock %}
